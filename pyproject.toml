[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "benthoz"
version = "0.2.0"
description = "Tools to access, manipulate and classify the BENTHOZ-2015 benthic imagery data set"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
authors = [{ name = "Michael Bewley" }]

# Floors are set to the versions the suite is actually verified against, rather
# than the oldest that might work.
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=20.0",          # parquet engine for the label splits
    "opencv-python-headless>=4.10",
    "requests>=2.32",
    "urllib3>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
]
notebook = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "networkx>=3.3",
]
# Kept out of [notebook] because pygraphviz compiles against system headers and
# will fail to build without them:  apt install graphviz graphviz-dev
graphviz = ["pygraphviz>=1.13"]

[project.urls]
"Data set paper" = "http://www.nature.com/articles/sdata201557"
"Data set" = "http://dx.doi.org/10.6084/m9.figshare.1524139"

[tool.setuptools]
packages = ["prep"]

[tool.pytest.ini_options]
# Anchors the pytest rootdir here, so the root conftest.py is always loaded and
# the suite runs identically from any working directory.
testpaths = ["tests"]

[tool.black]
line-length = 120
